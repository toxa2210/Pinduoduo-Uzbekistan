services:
  postgres:
    image: postgres:17-alpine
    container_name: pinduoduo-uz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pinduoduo_uz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pinduoduo_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pinduoduo-uz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pinduoduo_redis:/data

volumes:
  pinduoduo_pg:
  pinduoduo_redis:
