name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scaffold
        run: |
          test -f README.md
          test -f .gitignore
          test -f .env.example
          test -f SECURITY.md
          test -d frontend
          test -d backend
          test -d docs
